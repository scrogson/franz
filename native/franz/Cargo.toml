[package]
name = "franz"
version = "0.1.0"
authors = ["Sonny Scroggin <sonny@scrogg.in>"]
edition = "2018"

[lib]
name = "franz"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3"
once_cell = "1"
rdkafka = "0.37"
rustler = "0.36"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
