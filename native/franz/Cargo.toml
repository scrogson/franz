[package]
name = "franz"
version = "0.1.0"
authors = ["Sonny Scroggin <sonny@scrogg.in>"]
edition = "2018"

[lib]
name = "franz"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
rdkafka = "0.38"
rustler = { git = "https://github.com/rusterlium/rustler", branch = "async-nifs" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustler_unstable)'] }
